<svg xmlns="http://www.w3.org/2000/svg" width="176" height="120" preserveAspectRatio="xMidYMid meet" viewBox="0 0 176 120" version="1.0" fill-rule="evenodd" class="bar-chart joint-dof-chart" data-animate-bar-chart="" role="img" aria-labelledby="dof-flow-title" aria-describedby="dof-flow-description">
  <title id="dof-flow-title">Reported arm degrees of freedom</title>
  <desc id="dof-flow-description">Five DoF: 3 descriptions (9.1%); six DoF: 21 (63.6%); seven DoF: 9 (27.3%).</desc>
  <defs>
    <linearGradient id="dof-flow-gradient-1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0081ED" />
      <stop offset="100%" stop-color="#0081ED" />
    </linearGradient>
    <linearGradient id="dof-flow-gradient-2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3366EE" />
      <stop offset="100%" stop-color="#3366EE" />
    </linearGradient>
    <linearGradient id="dof-flow-gradient-3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8052E6" />
      <stop offset="100%" stop-color="#8052E6" />
    </linearGradient>
  </defs>
  <style>
svg.joint-dof-chart .chart-bar {
  transform-box: fill-box;
  transform-origin: 50% 0%;
  animation: dof-flow-rise 7.2s cubic-bezier(.22,.65,.25,1) infinite both;
  animation-delay: var(--bar-delay, 0s);
  animation-play-state: paused;
}
svg.joint-dof-chart .bar-value {
  animation: dof-flow-value-fade 7.2s ease infinite both;
  animation-delay: var(--bar-delay, 0s);
  animation-play-state: paused;
}
svg.joint-dof-chart:root .chart-bar,
svg.joint-dof-chart:root .bar-value,
svg.joint-dof-chart.is-visible .chart-bar,
svg.joint-dof-chart.is-visible .bar-value { animation-play-state: running; }
@keyframes dof-flow-rise {
  0% { transform: scaleY(0); opacity: 1; }
  18%, 80% { transform: scaleY(1); opacity: 1; }
  92%, 100% { transform: scaleY(1); opacity: 0; }
}
@keyframes dof-flow-value-fade {
  0%, 8% { opacity: 0; }
  18%, 80% { opacity: 1; }
  92%, 100% { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  svg.joint-dof-chart .chart-bar,
  svg.joint-dof-chart .bar-value {
    animation: none !important;
    transform: none !important;
    opacity: 1 !important;
  }
}
</style>
