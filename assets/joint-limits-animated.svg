<svg xmlns="http://www.w3.org/2000/svg" width="176" height="120" preserveAspectRatio="xMidYMid meet" viewBox="0 0 176 120" version="1.0" fill-rule="evenodd" class="bar-chart joint-limits-chart" data-animate-bar-chart="" role="img" aria-labelledby="limits-flow-title" aria-describedby="limits-flow-description">
  <title id="limits-flow-title">Joint-limit summary</title>
  <desc id="limits-flow-description">Bounded: 26 descriptions (78.8%); mixed: 4 (12.1%); unrestricted: 3 (9.1%).</desc>
  <defs>
    <linearGradient id="limits-flow-gradient-1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0081ED" />
      <stop offset="100%" stop-color="#0081ED" />
    </linearGradient>
    <linearGradient id="limits-flow-gradient-2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3366EE" />
      <stop offset="100%" stop-color="#3366EE" />
    </linearGradient>
    <linearGradient id="limits-flow-gradient-3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8052E6" />
      <stop offset="100%" stop-color="#8052E6" />
    </linearGradient>
  </defs>
  <style>
svg.joint-limits-chart .chart-bar {
  transform-box: fill-box;
  transform-origin: 50% 0%;
  animation: limits-flow-rise 7.2s cubic-bezier(.22,.65,.25,1) infinite both;
  animation-delay: var(--bar-delay, 0s);
  animation-play-state: paused;
}
svg.joint-limits-chart .bar-value {
  animation: limits-flow-value-fade 7.2s ease infinite both;
  animation-delay: var(--bar-delay, 0s);
  animation-play-state: paused;
}
svg.joint-limits-chart:root .chart-bar,
svg.joint-limits-chart:root .bar-value,
svg.joint-limits-chart.is-visible .chart-bar,
svg.joint-limits-chart.is-visible .bar-value { animation-play-state: running; }
@keyframes limits-flow-rise {
  0% { transform: scaleY(0); opacity: 1; }
  18%, 80% { transform: scaleY(1); opacity: 1; }
  92%, 100% { transform: scaleY(1); opacity: 0; }
}
@keyframes limits-flow-value-fade {
  0%, 8% { opacity: 0; }
  18%, 80% { opacity: 1; }
  92%, 100% { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  svg.joint-limits-chart .chart-bar,
  svg.joint-limits-chart .bar-value {
    animation: none !important;
    transform: none !important;
    opacity: 1 !important;
  }
}
</style>
